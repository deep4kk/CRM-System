<script>
let currentUser=null,deals=[],contacts=[],companies=[];
const STAGES=['Lead','Qualified','Proposal','Negotiation','Won','Lost'];
const STAGE_COLORS={Lead:'#9CA3AF',Qualified:'#3B82F6',Proposal:'#8B5CF6',Negotiation:'#F59E0B',Won:'#10B981',Lost:'#EF4444'};
document.addEventListener('DOMContentLoaded',async()=>{await loadUserInfo();await loadDashboard();setupListeners()});
async function loadUserInfo(){try{currentUser=await new Promise((r,e)=>{google.script.run.withSuccessHandler(r).withFailureHandler(e).getCurrentUser()});document.getElementById('userName').textContent=currentUser.name||currentUser.email;document.getElementById('userRole').textContent=currentUser.role||'Employee';document.getElementById('userAvatar').textContent=(currentUser.name||'U').charAt(0).toUpperCase()}catch(e){}}
function setupListeners(){document.querySelectorAll('.nav-item').forEach(b=>{b.addEventListener('click',()=>{if(b.dataset.view)switchView(b.dataset.view)})});document.getElementById('addDealBtn').addEventListener('click',()=>document.getElementById('dealModal').classList.add('active'));document.getElementById('addContactBtn').addEventListener('click',()=>document.getElementById('contactModal').classList.add('active'));document.getElementById('dealForm').addEventListener('submit',handleAddDeal);document.getElementById('contactForm').addEventListener('submit',handleAddContact)}
function switchView(view){document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.view===view));document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===view+'View'));document.getElementById('pageTitle').textContent={dashboard:'Dashboard',pipeline:'Pipeline',contacts:'Contacts',companies:'Companies',deals:'Deals'}[view]||'Dashboard';if(view==='pipeline')renderKanban();if(view==='contacts')renderContacts();if(view==='companies')renderCompanies();if(view==='deals')renderDeals()}
async function loadDashboard(){try{const data=await new Promise((r,e)=>{google.script.run.withSuccessHandler(r).withFailureHandler(e).getDashboardData()});document.getElementById('statValue').textContent='$'+data.totalValue.toLocaleString();document.getElementById('statDeals').textContent=data.dealCount;document.getElementById('statContacts').textContent=data.contactCount;document.getElementById('statCompanies').textContent=data.companyCount;renderPipelinePreview(data.pipeline)}catch(e){console.error(e)}}
function renderPipelinePreview(pipeline){const container=document.getElementById('pipelinePreview');let html='<h3>Pipeline Overview</h3><div class="pipeline-bars">';let maxVal=Math.max(...Object.values(pipeline).map(p=>p.value),1);STAGES.filter(s=>s!=='Won'&&s!=='Lost').forEach(stage=>{const p=pipeline[stage];const height=p.value>0?(p.value/maxVal)*100:5;html+=`<div class="pipeline-bar" onclick="switchView('pipeline')"><div class="pipeline-bar-fill" style="height:${height}%;background:${STAGE_COLORS[stage]}"></div><span class="pipeline-bar-label">${stage}</span><span class="pipeline-bar-value">$${(p.value/1000).toFixed(0)}k</span></div>`});html+='</div>';container.innerHTML=html}
async function renderKanban(){try{deals=await new Promise((r,e)=>{google.script.run.withSuccessHandler(r).withFailureHandler(e).getAllDeals()});const board=document.getElementById('kanbanBoard');let html='';STAGES.forEach(stage=>{const stageDeals=deals.filter(d=>d.stage===stage);const totalValue=stageDeals.reduce((s,d)=>s+d.value,0);html+=`<div class="kanban-column"><div class="kanban-column-header" style="border-color:${STAGE_COLORS[stage]}"><span class="kanban-column-title"><span style="width:10px;height:10px;border-radius:50%;background:${STAGE_COLORS[stage]}"></span>${stage}</span><span class="kanban-count">${stageDeals.length}</span></div><div class="kanban-cards" data-stage="${stage}">${stageDeals.map(d=>`<div class="kanban-card" data-id="${d.dealID}"><div class="deal-title">${d.title}</div><div class="deal-value">$${d.value.toLocaleString()}</div><div class="deal-meta">${d.probability}% · ${d.expectedClose?new Date(d.expectedClose).toLocaleDateString():'No date'}</div></div>`).join('')}</div></div>`});board.innerHTML=html;initSortable()}catch(e){showToast('Failed to load pipeline','error')}}
function initSortable(){document.querySelectorAll('.kanban-cards').forEach(col=>{new Sortable(col,{group:'deals',onEnd:async function(evt){const dealID=evt.item.dataset.id;const newStage=evt.to.dataset.stage;if(newStage){try{await new Promise((r,e)=>{google.script.run.withSuccessHandler(r).withFailureHandler(e).updateDealStage(dealID,newStage)});showToast('Deal moved to '+newStage,'success');loadDashboard()}catch(e){showToast(e.message,'error');renderKanban()}}}})})}
async function renderContacts(){try{contacts=await new Promise((r,e)=>{google.script.run.withSuccessHandler(r).withFailureHandler(e).getAllContacts()});document.getElementById('contactsList').innerHTML=contacts.length?contacts.map(c=>`<div class="contact-card"><div class="contact-avatar">${c.firstName.charAt(0)}</div><div class="contact-info"><div class="contact-name">${c.firstName} ${c.lastName}</div><div class="contact-role">${c.designation||'No title'}</div><div style="font-size:12px;color:var(--gray-400)">${c.email||''}</div></div></div>`).join(''):'<p style="text-align:center;padding:40px;color:var(--gray-500)">No contacts yet</p>'}catch(e){showToast('Failed to load contacts','error')}}
async function renderCompanies(){try{companies=await new Promise((r,e)=>{google.script.run.withSuccessHandler(r).withFailureHandler(e).getAllCompanies()});document.getElementById('companiesList').innerHTML=companies.length?companies.map(c=>`<div class="company-card"><div class="contact-avatar" style="background:linear-gradient(135deg,#F97316,#EA580C)">${c.name.charAt(0)}</div><div class="company-info"><div class="company-name">${c.name}</div><div class="company-industry">${c.industry||'No industry'} · ${c.size||''}</div></div></div>`).join(''):'<p style="text-align:center;padding:40px;color:var(--gray-500)">No companies yet</p>'}catch(e){showToast('Failed to load companies','error')}}
async function renderDeals(){try{deals=await new Promise((r,e)=>{google.script.run.withSuccessHandler(r).withFailureHandler(e).getAllDeals()});document.getElementById('dealsList').innerHTML=deals.length?deals.map(d=>`<div class="deal-card"><div class="deal-value">$${d.value.toLocaleString()}</div><div style="flex:1"><div style="font-weight:600">${d.title}</div><div style="font-size:12px;color:var(--gray-500)">${d.stage}</div></div><span style="padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;background:${STAGE_COLORS[d.stage]+'20'};color:${STAGE_COLORS[d.stage]}">${d.stage}</span></div>`).join(''):'<p style="text-align:center;padding:40px;color:var(--gray-500)">No deals yet</p>'}catch(e){showToast('Failed to load deals','error')}}
async function handleAddDeal(e){e.preventDefault();try{await new Promise((r,rej)=>{google.script.run.withSuccessHandler(r).withFailureHandler(rej).addDeal(document.getElementById('dealTitle').value,parseFloat(document.getElementById('dealValue').value),document.getElementById('dealStage').value,'','',document.getElementById('dealClose').value,document.getElementById('dealNotes').value)});showToast('Deal created!','success');document.getElementById('dealModal').classList.remove('active');document.getElementById('dealForm').reset();loadDashboard();renderKanban()}catch(e){showToast(e.message||'Failed to create deal','error')}}
async function handleAddContact(e){e.preventDefault();try{await new Promise((r,rej)=>{google.script.run.withSuccessHandler(r).withFailureHandler(rej).addContact(document.getElementById('contactFirst').value,document.getElementById('contactLast').value,document.getElementById('contactEmail').value,document.getElementById('contactPhone').value,'',document.getElementById('contactTitle').value)});showToast('Contact added!','success');document.getElementById('contactModal').classList.remove('active');document.getElementById('contactForm').reset();renderContacts();loadDashboard()}catch(e){showToast(e.message||'Failed to add contact','error')}}
function closeModal(id){document.getElementById(id).classList.remove('active')}
function showToast(m,t='success'){const c=document.getElementById('toastContainer');const toast=document.createElement('div');toast.className=`toast ${t}`;toast.innerHTML=`<span>${m}</span>`;c.appendChild(toast);setTimeout(()=>{toast.style.opacity='0';setTimeout(()=>toast.remove(),300)},3000)}
</script>

<!DOCTYPE html>
<html lang="en">
<head><base target="_top"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CRM System</title><?!= include('Stylesheet'); ?></head>
<body>
<div class="app-container">
<aside class="sidebar">
<div class="sidebar-header"><div class="logo crm-logo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></div><span class="logo-text">CRM</span></div>
<nav class="sidebar-nav">
<button class="nav-item active" data-view="dashboard"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg><span>Dashboard</span></button>
<button class="nav-item" data-view="pipeline"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg><span>Pipeline</span></button>
<button class="nav-item" data-view="contacts"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>Contacts</span></button>
<button class="nav-item" data-view="companies"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg><span>Companies</span></button>
<button class="nav-item" data-view="deals"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg><span>Deals</span></button>
</nav>
<div class="sidebar-footer"><div class="user-info"><div class="user-avatar" id="userAvatar">U</div><div class="user-details"><span class="user-name" id="userName">Loading...</span><span class="user-role" id="userRole">-</span></div></div></div>
</aside>
<main class="main-content">
<header class="top-bar"><h1 class="page-title" id="pageTitle">Dashboard</h1><div class="top-actions"><button class="btn btn-secondary" id="addContactBtn">Add Contact</button><button class="btn btn-primary" id="addDealBtn">New Deal</button></div></header>
<div class="content-area">
<section class="view active" id="dashboardView">
<div class="stats-row">
<div class="stat-card"><div class="stat-icon primary"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg></div><div><span class="stat-label">Pipeline Value</span><span class="stat-value" id="statValue">$0</span></div></div>
<div class="stat-card"><div class="stat-icon success"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg></div><div><span class="stat-label">Deals</span><span class="stat-value" id="statDeals">0</span></div></div>
<div class="stat-card"><div class="stat-icon purple"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg></div><div><span class="stat-label">Contacts</span><span class="stat-value" id="statContacts">0</span></div></div>
<div class="stat-card"><div class="stat-icon orange"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></div><div><span class="stat-label">Companies</span><span class="stat-value" id="statCompanies">0</span></div></div>
</div>
<div class="pipeline-preview" id="pipelinePreview"></div>
</section>
<section class="view" id="pipelineView"><div class="kanban-board" id="kanbanBoard"></div></section>
<section class="view" id="contactsView"><div class="contacts-list" id="contactsList"></div></section>
<section class="view" id="companiesView"><div class="companies-list" id="companiesList"></div></section>
<section class="view" id="dealsView"><div class="deals-list" id="dealsList"></div></section>
</div>
</main>
</div>
<div class="modal-overlay" id="dealModal"><div class="modal"><div class="modal-header"><h3>New Deal</h3><button class="modal-close" onclick="closeModal('dealModal')">&times;</button></div><div class="modal-body"><form id="dealForm"><div class="form-group"><label>Title</label><input type="text" id="dealTitle" required></div><div class="form-row"><div class="form-group"><label>Value ($)</label><input type="number" id="dealValue" required></div><div class="form-group"><label>Stage</label><select id="dealStage" required><option value="Lead">Lead</option><option value="Qualified">Qualified</option><option value="Proposal">Proposal</option><option value="Negotiation">Negotiation</option></select></div></div><div class="form-group"><label>Expected Close</label><input type="date" id="dealClose"></div><div class="form-group"><label>Notes</label><textarea id="dealNotes" rows="3"></textarea></div><div class="form-actions"><button type="submit" class="btn btn-primary">Create Deal</button></div></form></div></div></div>
<div class="modal-overlay" id="contactModal"><div class="modal"><div class="modal-header"><h3>Add Contact</h3><button class="modal-close" onclick="closeModal('contactModal')">&times;</button></div><div class="modal-body"><form id="contactForm"><div class="form-row"><div class="form-group"><label>First Name</label><input type="text" id="contactFirst" required></div><div class="form-group"><label>Last Name</label><input type="text" id="contactLast" required></div></div><div class="form-group"><label>Email</label><input type="email" id="contactEmail"></div><div class="form-group"><label>Phone</label><input type="tel" id="contactPhone"></div><div class="form-group"><label>Designation</label><input type="text" id="contactTitle"></div><div class="form-actions"><button type="submit" class="btn btn-primary">Add Contact</button></div></form></div></div></div>
<div class="toast-container" id="toastContainer"></div>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
